  <style>
    /* ── Sticky sub-nav ── */
    #offer-subnav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--cream-2);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(44,30,21,.06);
    }
    .subnav-inner {
      max-width: 72rem;
      margin: 0 auto;
      padding: .6rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: .3rem .5rem;
      align-items: center;
    }
    .subnav-link {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      padding: .45rem .9rem;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: color .25s, border-color .25s, background-color .25s;
    }
    .subnav-link:hover {
      color: var(--clay);
      border-color: var(--border);
      background: var(--cream);
    }
    /* ── pull-quote ── */
    .pull-quote {
      border-inline-start: 2px solid var(--gold);
      padding-inline-start: 1.5rem;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.7;
      color: var(--muted-inv);
    }
    .pull-quote p + p { margin-top: .7em; }
    /* cream pull-quote variant (on cream bg) */
    .pull-quote--cream {
      color: var(--muted);
      border-color: var(--clay-light);
    }
    /* ── invite passage ── */
    .invite-block {
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      margin-top: 1.5rem;
      font-style: italic;
      color: var(--muted);
      line-height: 1.85;
    }
    .invite-block p + p { margin-top: .6em; }
    /* ── support list ── */
    .support-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }
    .support-list li {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      font-size: .97rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .support-list li::before {
      content: '';
      flex: none;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--clay-light);
      margin-top: .42em;
    }
    .on-dark .support-list li { color: var(--muted-inv); }
    .on-dark .support-list li::before { background: var(--gold); }
    /* ── private chef: photo bed on the left, fading into the cocoa ──
       Mobile has no left/right to play with, so the photo backs the section
       header instead and fades downward before the copy starts. ── */
    .chef-figure {
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      width: 100%;
      height: 30rem;
      overflow: hidden;
    }
    .chef-figure img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 52% 48%;
      filter: brightness(.62) saturate(.9);
      --chef-fade: linear-gradient(to bottom, #000 0%, #000 34%, transparent 96%);
      -webkit-mask-image: var(--chef-fade);
      mask-image: var(--chef-fade);
    }
    /* darken veil so the copy stays legible over the food */
    .chef-figure::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
                  rgba(36,24,17,.62) 0%, rgba(36,24,17,.58) 40%,
                  rgba(36,24,17,.34) 74%, transparent 100%);
    }
    @media (min-width: 768px) {
      .chef-figure { inset-block: 0; height: auto; width: 62%; }
      .chef-figure img {
        filter: brightness(.46) saturate(.85);
        --chef-fade: linear-gradient(to right, #000 0%, #000 40%, transparent 96%);
      }
      .chef-figure::after {
        background: linear-gradient(to right,
                    rgba(36,24,17,.72) 0%, rgba(36,24,17,.66) 45%,
                    rgba(36,24,17,.36) 76%, transparent 100%);
      }
      [dir="rtl"] .chef-figure img {
        --chef-fade: linear-gradient(to left, #000 0%, #000 40%, transparent 96%);
      }
      [dir="rtl"] .chef-figure::after { transform: scaleX(-1); }
    }
    .on-dark .invite-block { color: var(--muted-inv); border-top-color: var(--border-dark); }

    /* mentorship cards */
    .mentor-card-active { outline: 2px solid var(--clay); outline-offset: 3px; }

    /* ── section divider ── */
    .section-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0;
    }
  </style>

        (function () {
          var panel = document.getElementById('mentorPanel');
          var buttons = document.querySelectorAll('[data-mentor-toggle]');
          var details = document.querySelectorAll('[data-mentor-detail]');
          var open = null;
          function setOpen(n) {
            open = n;
            panel.classList.toggle('hidden', n === null);
            details.forEach(function (d) {
              d.classList.toggle('hidden', d.dataset.mentorDetail !== String(n));
            });
            buttons.forEach(function (b) {
              var on = b.dataset.mentorToggle === String(n);
              b.setAttribute('aria-expanded', on ? 'true' : 'false');
              b.closest('article').classList.toggle('mentor-card-active', on);
            });
            if (n !== null) {
              panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
          }
          buttons.forEach(function (b) {
            b.addEventListener('click', function () {
              var n = b.dataset.mentorToggle;
              setOpen(open === n ? null : n);
            });
          });
          document.getElementById('mentorClose').addEventListener('click', function () { setOpen(null); });
