name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The client's retreats sheet, as a gviz CSV endpoint. Repository
          # secret, never committed: this repo is public. Unset, the retreats
          # page renders its evergreen "new dates announced soon" block.
          RETREATS_SHEET_URL: ${{ secrets.RETREATS_SHEET_URL }}
          # The Reviews tab of the same spreadsheet, so it carries that tab's
          # own gid. Unset, the home page renders its evergreen quote instead
          # of the reviews carousel.
          REVIEWS_SHEET_URL: ${{ secrets.REVIEWS_SHEET_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
